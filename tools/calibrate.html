<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>社区地图校准器 — The Long Dark</title>
<style>
  :root { --bg:#14171c; --panel:#1d222a; --line:#2e3641; --fg:#dfe6ee; --dim:#8b98a8; --acc:#4da3ff; --ok:#48c78e; --warn:#e0a23c; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:13px/1.5 "Segoe UI",system-ui,sans-serif; }
  header { padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); display:flex; gap:16px; align-items:baseline; flex-wrap:wrap; }
  h1 { font-size:15px; margin:0; font-weight:600; }
  header .hint { color:var(--dim); font-size:12px; }
  main { display:grid; grid-template-columns:400px 1fr; height:calc(100vh - 45px); }
  #side { background:var(--panel); border-right:1px solid var(--line); overflow-y:auto; padding:12px; }
  #view { position:relative; overflow:hidden; background:#0d1014; cursor:crosshair; }
  canvas { display:block; }
  .box { border:1px solid var(--line); border-radius:6px; padding:10px; margin-bottom:12px; }
  .box h2 { font-size:12px; margin:0 0 8px; color:var(--acc); font-weight:600; letter-spacing:.4px; text-transform:uppercase; }
  label { display:block; margin:6px 0 3px; color:var(--dim); font-size:12px; }
  input[type=file] { width:100%; font-size:12px; color:var(--dim); }
  input[type=number], select { width:100%; background:#12161b; color:var(--fg); border:1px solid var(--line); border-radius:4px; padding:4px 6px; }
  button { background:#26303c; color:var(--fg); border:1px solid var(--line); border-radius:4px; padding:5px 10px; cursor:pointer; font-size:12px; }
  button:hover { background:#31404f; }
  button.pri { background:var(--acc); border-color:var(--acc); color:#06121f; font-weight:600; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th,td { text-align:left; padding:3px 4px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--dim); font-weight:500; }
  tr.anchor { background:#1b3a2a; }
  tr.picked td:first-child::before { content:"● "; color:var(--ok); }
  .row-btn { padding:1px 6px; font-size:11px; }
  #json { width:100%; height:150px; background:#12161b; color:var(--fg); border:1px solid var(--line); border-radius:4px; font:11px/1.4 Consolas,monospace; }
  .stat { display:flex; justify-content:space-between; padding:2px 0; border-bottom:1px dashed var(--line); }
  .stat b { font-weight:600; }
  .ok { color:var(--ok); } .warn { color:var(--warn); }
  #status { position:absolute; left:10px; bottom:10px; background:rgba(0,0,0,.72); padding:5px 10px; border-radius:4px; font-size:12px; pointer-events:none; }
</style>
</head>
<body>
<header>
  <h1>社区地图校准器</h1>
  <span class="hint">原理：社区图 = S × 原版 NGUI 坐标 + 平移（无旋转、无镜像）。S 默认 8.61；
    点选 ≥2 个锚点后自动最小二乘拟合 S。</span>
</header>

<main>
<div id="side">
  <div class="box">
    <h2>1 · 载入</h2>
    <label>地图图片（prepared-maps\&lt;map&gt;.jpg）</label>
    <input type="file" id="imgFile" accept="image/*">
    <label>calibration_points_v2.csv</label>
    <input type="file" id="f9File" accept=".csv,text/csv">
    <label>vanilla_map_coordinates.csv</label>
    <input type="file" id="vxFile" accept=".csv,text/csv">
    <label>场景筛选</label>
    <select id="sceneSel"><option value="">（先载入 CSV）</option></select>
  </div>

  <div class="box">
    <h2>2 · 锚点</h2>
    <div class="hint" style="color:var(--dim);margin-bottom:6px">
      点表格里的「锚」把该点设为待标定，然后在地图上点击它所在的位置。
    </div>
    <table id="ptTable">
      <thead><tr><th>点</th><th>NGUI</th><th>地图像素</th><th title="该锚点偏离拟合的像素数；越小越好">误差</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="box">
    <h2>3 · 缩放常数 S</h2>
    <label>S（社区像素 / NGUI 单位）— 锚点少于 2 个时使用</label>
    <input type="number" id="sInput" value="8.61" step="0.01">
    <div id="sFit" class="hint" style="color:var(--dim);margin-top:4px"></div>
  </div>

  <div class="box">
    <h2>4 · 结果</h2>
    <div id="stats"></div>
  </div>

  <div class="box">
    <h2>5 · calibrations.json 片段</h2>
    <textarea id="json" readonly></textarea>
    <div style="margin-top:6px;display:flex;gap:6px">
      <button class="pri" id="copyBtn">复制 JSON</button>
      <button id="resetBtn">清除锚点</button>
    </div>
  </div>
</div>

<div id="view">
  <canvas id="cv"></canvas>
  <div id="status">先载入地图图片</div>
</div>
</main>

<script>
"use strict";

// ---------------- state ----------------
const state = {
  img: null,
  points: [],          // {id, scene, worldX, worldZ, u, v, px:null, py:null}
  anchors: new Map(),  // id -> {px, py}
  activeAnchorId: null,
  view: { scale: 1, tx: 0, ty: 0 },
  dragging: false, lastX: 0, lastY: 0,
};

const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const statusEl = document.getElementById("status");

// ---------------- csv ----------------
function parseCsv(text) {
  const rows = [];
  let row = [], field = "", inQ = false;
  text = text.replace(/^\uFEFF/, "");
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"') { if (text[i+1] === '"') { field += '"'; i++; } else inQ = false; }
      else field += c;
    } else if (c === '"') inQ = true;
    else if (c === ',') { row.push(field); field = ""; }
    else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ""; }
    else if (c !== '\r') field += c;
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  if (!rows.length) return [];
  const head = rows[0].map(h => h.trim());
  return rows.slice(1).filter(r => r.length > 1).map(r => {
    const o = {}; head.forEach((h, i) => o[h] = (r[i] ?? "").trim()); return o;
  });
}

let f9Rows = [], vxRows = [];

function rebuildPoints() {
  const scene = document.getElementById("sceneSel").value;
  const byId = new Map(vxRows.map(r => [r.capture_id, r]));
  state.points = [];
  for (const f of f9Rows) {
    if (!f.capture_id) continue;
    if (scene && f.scene !== scene) continue;
    const v = byId.get(f.capture_id);
    if (!v || v.available !== "true") continue;
    const u = parseFloat(v.map_x), vv = parseFloat(v.map_y);
    const wx = parseFloat(f.x), wz = parseFloat(f.z);
    if (!isFinite(u) || !isFinite(vv) || !isFinite(wx) || !isFinite(wz)) continue;
    state.points.push({ id: f.capture_id, scene: f.scene, worldX: wx, worldZ: wz, u, v: vv, px: null, py: null });
  }
  state.anchors.clear(); state.activeAnchorId = null;
  recompute();
}

function fillScenes() {
  const sel = document.getElementById("sceneSel");
  const scenes = [...new Set(f9Rows.map(r => r.scene).filter(Boolean))].sort();
  sel.innerHTML = scenes.map(s => `<option>${s}</option>`).join("");
  const pref = scenes.find(s => s !== "TracksRegion") || scenes[0];
  if (pref) sel.value = pref;
}

// ---------------- 3x3 solve ----------------
function solve3(A, b) {
  const m = [[...A[0], b[0]], [...A[1], b[1]], [...A[2], b[2]]];
  for (let i = 0; i < 3; i++) {
    let p = i;
    for (let r = i + 1; r < 3; r++) if (Math.abs(m[r][i]) > Math.abs(m[p][i])) p = r;
    if (Math.abs(m[p][i]) < 1e-12) return null;
    [m[i], m[p]] = [m[p], m[i]];
    const d = m[i][i];
    for (let c = i; c < 4; c++) m[i][c] /= d;
    for (let r = 0; r < 3; r++) {
      if (r === i) continue;
      const f = m[r][i];
      for (let c = i; c < 4; c++) m[r][c] -= f * m[i][c];
    }
  }
  return [m[0][3], m[1][3], m[2][3]];
}

// world(x,z) -> NGUI(u,v)  :  u = a x + b z + c ;  v = d x + e z + f
function fitWorldToNgui(pts) {
  const N = [[0,0,0],[0,0,0],[0,0,0]], bu = [0,0,0], bv = [0,0,0];
  for (const p of pts) {
    const r = [p.worldX, p.worldZ, 1];
    for (let i = 0; i < 3; i++) {
      bu[i] += r[i] * p.u; bv[i] += r[i] * p.v;
      for (let j = 0; j < 3; j++) N[i][j] += r[i] * r[j];
    }
  }
  return { u: solve3(N, bu), v: solve3(N, bv) };
}

// ---------------- core ----------------
function compute() {
  const pts = state.points;
  if (!pts.length) return null;
  const fit = fitWorldToNgui(pts);
  if (!fit.u || !fit.v) return null;

  // residuals of the world->NGUI fit
  let maxRes = 0;
  for (const p of pts) {
    const eu = fit.u[0]*p.worldX + fit.u[1]*p.worldZ + fit.u[2] - p.u;
    const ev = fit.v[0]*p.worldX + fit.v[1]*p.worldZ + fit.v[2] - p.v;
    maxRes = Math.max(maxRes, Math.hypot(eu, ev));
  }

  // Fit a similarity in the map plane, NOT just scale+translation: some community maps are
  // rotated relative to the in-game map, and forcing zero rotation would silently skew them.
  // Work in complex numbers: z = u + i*(-v) (v flipped so both axes point "down" like image
  // rows), w = mapX + i*mapY, and solve w = a*z + c in the least-squares sense. |a| is the
  // scale and arg(a) the rotation, so a near-zero angle confirms the two maps share an
  // orientation.
  const manualS = parseFloat(document.getElementById("sInput").value) || 8.61;
  let aRe = manualS, aIm = 0, tx = 0, ty = 0, fitted = false, theta = 0;

  const A = pts.filter(p => state.anchors.has(p.id)).map(p => ({ ...p, ...state.anchors.get(p.id) }));
  if (A.length >= 2) {
    const n = A.length;
    let mzx = 0, mzy = 0, mwx = 0, mwy = 0;
    for (const a of A) { mzx += a.u; mzy += -a.v; mwx += a.px; mwy += a.py; }
    mzx /= n; mzy /= n; mwx /= n; mwy /= n;
    let numRe = 0, numIm = 0, den = 0;
    for (const a of A) {
      const dzx = a.u - mzx, dzy = -a.v - mzy;
      const dwx = a.px - mwx, dwy = a.py - mwy;
      numRe += dzx*dwx + dzy*dwy;
      numIm += dzx*dwy - dzy*dwx;
      den   += dzx*dzx + dzy*dzy;
    }
    if (den > 1e-9) {
      aRe = numRe/den; aIm = numIm/den;
      tx = mwx - (aRe*mzx - aIm*mzy);
      ty = mwy - (aRe*mzy + aIm*mzx);
      fitted = true;
      theta = Math.atan2(aIm, aRe) * 180 / Math.PI;
    }
  }
  if (!fitted) {
    aRe = manualS; aIm = 0;
    if (A.length >= 1) {
      tx = A[0].px - aRe * A[0].u;
      ty = A[0].py - aRe * (-A[0].v);
    } else {
      return { fit, S: manualS, theta: 0, tx: 0, ty: 0, fitted: false, maxRes,
               pts: [], anchorErrors: [] };
    }
  }
  const S = Math.hypot(aRe, aIm);

  const out = pts.map(p => {
    const u = fit.u[0]*p.worldX + fit.u[1]*p.worldZ + fit.u[2];
    const v = fit.v[0]*p.worldX + fit.v[1]*p.worldZ + fit.v[2];
    const zx = u, zy = -v;
    return { ...p, u, v, mx: aRe*zx - aIm*zy + tx, my: aRe*zy + aIm*zx + ty };
  });

  const anchorErrors = A.map(a => {
    const p = out.find(o => o.id === a.id);
    return { id: a.id, err: Math.hypot(p.mx - a.px, p.my - a.py) };
  });

  // anisotropy of the implied world->map affine
  const N = [[0,0,0],[0,0,0],[0,0,0]], bX = [0,0,0], bY = [0,0,0];
  for (const p of out) {
    const r = [p.worldX, p.worldZ, 1];
    for (let i=0;i<3;i++){ bX[i]+=r[i]*p.mx; bY[i]+=r[i]*p.my;
      for(let j=0;j<3;j++) N[i][j]+=r[i]*r[j]; }
  }
  const fx = solve3(N, bX), fy = solve3(N, bY);
  let aniso = null, scaleX = null, scaleY = null;
  if (fx && fy) {
    // 2x2 = [[dX/dx, dX/dz],[dY/dx, dY/dz]] ; singular values from M^T M
    const a = fx[0], bb = fx[1], c = fy[0], d = fy[1];
    const p = a*a + c*c, q = bb*bb + d*d, r = a*bb + c*d;
    const tr = p + q, det = p*q - r*r;
    const disc = Math.sqrt(Math.max(0, tr*tr/4 - det));
    scaleX = Math.sqrt(Math.max(1e-12, tr/2 + disc));
    scaleY = Math.sqrt(Math.max(1e-12, tr/2 - disc));
    aniso = scaleX / scaleY;
  }
  return { fit, S, theta, tx, ty, fitted, maxRes, pts: out, anchorErrors, aniso, scaleX, scaleY };
}

// ---------------- render ----------------
function renderTable(r) {
  const tb = document.querySelector("#ptTable tbody");
  tb.innerHTML = "";
  const errOf = {};
  if (r && r.anchorErrors) for (const e of r.anchorErrors) errOf[e.id] = e.err;
  for (const p of state.points) {
    const a = state.anchors.get(p.id);
    const tr = document.createElement("tr");
    if (a) tr.className = "picked";
    if (state.activeAnchorId === p.id) tr.classList.add("anchor");
    let errCell = "—";
    if (a && errOf[p.id] !== undefined) {
      const e = errOf[p.id];
      const cls = e < 20 ? "ok" : (e < 45 ? "" : "warn");
      errCell = `<span class="${cls}">${e.toFixed(1)} px</span>`;
    }
    tr.innerHTML = `<td>${p.scene}<br><span style="color:var(--dim)">${p.worldX.toFixed(0)}, ${p.worldZ.toFixed(0)}</span></td>
      <td>${p.u.toFixed(1)}<br>${p.v.toFixed(1)}</td>
      <td>${a ? a.px.toFixed(0) + ", " + a.py.toFixed(0) : "—"}</td>
      <td>${errCell}</td>
      <td><button class="row-btn" data-id="${p.id}">锚</button></td>`;
    tb.appendChild(tr);
  }
  tb.querySelectorAll("button[data-id]").forEach(b => b.onclick = () => {
    state.activeAnchorId = b.dataset.id;
    recompute();
  });
}

function renderStats(r) {
  const el = document.getElementById("stats");
  const sf = document.getElementById("sFit");
  if (!r || !r.pts.length) { el.innerHTML = '<span style="color:var(--dim)">先点一个锚点</span>'; sf.textContent = ""; return; }
  const rows = [];
  rows.push(["F9 数据一致性（world→NGUI 残差）", r.maxRes.toExponential(2) + " NGUI"]);
  rows.push(["S", r.S.toFixed(4) + (r.fitted ? "（已拟合）" : "（手动）")]);
  const th = ((r.theta + 180) % 360 + 360) % 360 - 180;
  const thCls = Math.abs(th) < 0.5 ? "ok" : (Math.abs(th) < 3 ? "" : "warn");
  rows.push(["相对原版图的旋转",
             `<span class="${thCls}">${th.toFixed(2)}°</span>` +
             (Math.abs(th) < 0.5 ? "（无旋转）" : (Math.abs(th) > 5 ? "（这张图是转过的！）" : ""))]);
  rows.push(["平移 tx, ty", r.tx.toFixed(1) + ", " + r.ty.toFixed(1)]);
  if (r.aniso) rows.push(["各向异性", r.aniso.toFixed(4) + " (" + ((r.aniso-1)*100).toFixed(2) + "%)"]);
  if (r.scaleX) rows.push(["px / 世界单位", r.scaleX.toFixed(3) + " / " + r.scaleY.toFixed(3)]);
  el.innerHTML = rows.map(([k,v]) => `<div class="stat"><span>${k}</span><b>${v}</b></div>`).join("");
  const worst = r.anchorErrors.length ? Math.max(...r.anchorErrors.map(e => e.err)) : null;
  sf.innerHTML = (r.fitted ? "" : "锚点少于 2 个，S 用上面的手动值。<br>") +
    (worst === null ? "" :
      `锚点最大误差 <b class="${worst < 20 ? 'ok' : (worst < 45 ? '' : 'warn')}">${worst.toFixed(1)} px</b>` +
      `（每行误差见上表；>45px 建议重新点）`);
  return rows;
}

function renderJson(r) {
  const ta = document.getElementById("json");
  if (!r || !r.pts.length) { ta.value = ""; return; }
  const pts = r.pts.map(p => ({
    worldX: +p.worldX.toFixed(3), worldZ: +p.worldZ.toFixed(3),
    mapX: +p.mx.toFixed(1), mapY: +p.my.toFixed(1), label: ""
  }));
  ta.value = JSON.stringify({ imageWidth: state.img ? state.img.width : 0,
                              imageHeight: state.img ? state.img.height : 0,
                              points: pts }, null, 2);
}

function recompute() {
  const r = compute();
  renderTable(r); renderStats(r); renderJson(r); draw(); updateStatus(r);
}

function updateStatus(r) {
  let msg = state.img ? `图 ${state.img.width}×${state.img.height}` : "先载入地图图片";
  msg += ` · 点 ${state.points.length}`;
  if (state.activeAnchorId) msg += ` · 待标定：点地图上该地标`;
  else if (state.anchors.size) msg += ` · 锚点 ${state.anchors.size}`;
  statusEl.textContent = msg;
}

// ---------------- canvas ----------------
function resize() {
  const v = document.getElementById("view");
  cv.width = v.clientWidth; cv.height = v.clientHeight;
  draw();
}
function fitView() {
  if (!state.img) return;
  const v = document.getElementById("view");
  const s = Math.min(v.clientWidth / state.img.width, v.clientHeight / state.img.height) * 0.98;
  state.view.scale = s;
  state.view.tx = (v.clientWidth - state.img.width * s) / 2;
  state.view.ty = (v.clientHeight - state.img.height * s) / 2;
}
function draw() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  if (!state.img) return;
  const { scale, tx, ty } = state.view;
  ctx.save(); ctx.translate(tx, ty); ctx.scale(scale, scale);
  ctx.drawImage(state.img, 0, 0);
  const r = compute();
  if (r && r.pts.length) {
    ctx.lineWidth = 2 / scale;
    for (const p of r.pts) {
      const a = state.anchors.get(p.id);
      ctx.beginPath(); ctx.arc(p.mx, p.my, 7 / scale, 0, Math.PI * 2);
      ctx.strokeStyle = a ? "#48c78e" : "#4da3ff"; ctx.stroke();
      if (a) { ctx.beginPath(); ctx.arc(a.px, a.py, 4 / scale, 0, Math.PI*2); ctx.fillStyle = "#e0a23c"; ctx.fill(); }
      ctx.fillStyle = "rgba(0,0,0,.65)";
      const t = p.scene.slice(0, 14);
      ctx.font = `${11/scale}px sans-serif`;
      ctx.fillText(t, p.mx + 9/scale, p.my - 6/scale);
    }
  }
  ctx.restore();
}
function toImage(clientX, clientY) {
  const r = cv.getBoundingClientRect();
  return { x: (clientX - r.left - state.view.tx) / state.view.scale,
           y: (clientY - r.top  - state.view.ty) / state.view.scale };
}

cv.addEventListener("mousedown", e => {
  if (state.activeAnchorId) {
    const p = toImage(e.clientX, e.clientY);
    state.anchors.set(state.activeAnchorId, { px: p.x, py: p.y });
    state.activeAnchorId = null;
    recompute();
    return;
  }
  state.dragging = true; state.lastX = e.clientX; state.lastY = e.clientY;
});
cv.addEventListener("mousemove", e => {
  if (!state.dragging) return;
  state.view.tx += e.clientX - state.lastX; state.view.ty += e.clientY - state.lastY;
  state.lastX = e.clientX; state.lastY = e.clientY; draw();
});
window.addEventListener("mouseup", () => state.dragging = false);
cv.addEventListener("wheel", e => {
  e.preventDefault();
  const p = toImage(e.clientX, e.clientY);
  const k = e.deltaY < 0 ? 1.15 : 1/1.15;
  state.view.scale *= k;
  // keep the point under the cursor fixed
  state.view.tx = e.clientX - cv.getBoundingClientRect().left - p.x * state.view.scale;
  state.view.ty = e.clientY - cv.getBoundingClientRect().top  - p.y * state.view.scale;
  draw();
}, { passive: false });

// ---------------- files ----------------
document.getElementById("imgFile").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const img = new Image();
  img.onload = () => { state.img = img; fitView(); recompute(); };
  img.src = URL.createObjectURL(f);
};
document.getElementById("f9File").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  f.text().then(t => { f9Rows = parseCsv(t); fillScenes(); rebuildPoints(); });
};
document.getElementById("vxFile").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  f.text().then(t => { vxRows = parseCsv(t); rebuildPoints(); });
};
document.getElementById("sceneSel").onchange = rebuildPoints;
document.getElementById("sInput").oninput = recompute;
document.getElementById("copyBtn").onclick = () => {
  const ta = document.getElementById("json"); ta.select();
  document.execCommand("copy");
  document.getElementById("copyBtn").textContent = "已复制";
  setTimeout(() => document.getElementById("copyBtn").textContent = "复制 JSON", 1200);
};
document.getElementById("resetBtn").onclick = () => {
  state.anchors.clear(); state.activeAnchorId = null; recompute();
};
window.addEventListener("resize", resize);

resize();
</script>
</body>
</html>
